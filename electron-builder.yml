appId: com.timetrack.app
productName: TimeTrack
# The copyright holder from LICENSE. Without this key electron-builder writes
# "Copyright © <year> ${author}" (wald-it, the publisher) into the exe.
copyright: Copyright (c) 2026 Robin Wald
directories:
  buildResources: build
# Positive list (release 1.22): only what the app reads at runtime goes into
# the package — the build output, the bundled resources (icons, licences),
# package.json and the licence. Production dependencies under node_modules are
# added by electron-builder in any case. Everything else in the checkout
# (design material, docs, notes, local tool folders) stays out without having
# to be excluded one by one. scripts/check-package-contents.mjs checks the
# result after every build.
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
  # #269: better-sqlite3 13 ships prebuilt binaries for eight platforms; the
  # package needs only its own (about 2 MB each, unpacked from the asar).
  # check-package-contents.mjs fails when a foreign one is left in.
  - '!node_modules/better-sqlite3/prebuilds/!(${platform}-${arch}).node'
asarUnpack:
  - resources/**
  - '**/*.node'
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

win:
  executableName: TimeTrack
  target:
    - nsis
nsis:
  # #198 — cooperative release of the app binary held by bundled MCP servers,
  # ahead of the built-in app-running check. See build/installer.nsh.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
# Electron fuses (#272): set here, in the packaging step only, never in
# node_modules/electron (the unfused dev binary runs the test runner and
# `pnpm dev`). scripts/package-smoke.mjs reads the fuse wire of the packaged
# binary and checks every value below on each PR.
# - runAsNode MUST stay true: the bundled MCP server runs the app binary in
#   Node mode (ELECTRON_RUN_AS_NODE=1, src/main/mcpLaunch.ts), and so does the
#   smoke test's cleaner. Off, both fail with no visible error.
# - onlyLoadAppFromAsar + enableEmbeddedAsarIntegrityValidation: the app code
#   loads only from the packaged app.asar, and only if it is unchanged.
# - enableNodeCliInspectArguments / enableNodeOptionsEnvironmentVariable off:
#   no --inspect debugger and no NODE_OPTIONS injection into the packaged app
#   (nothing in TimeTrack uses either).
# grantFileProtocolExtraPrivileges stays at its default: the renderer loads
# over file://.
electronFuses:
  runAsNode: true
  onlyLoadAppFromAsar: true
  enableEmbeddedAsarIntegrityValidation: true
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
npmRebuild: false
publish:
  provider: github
  owner: wald-it
  repo: time-tracking
