appId: com.timetrack.app
productName: TimeTrack
directories:
  buildResources: build
# Positive list (release 1.22): only what the app reads at runtime goes into
# the package — the build output, the bundled resources (icons, licences),
# package.json and the licence. Production dependencies under node_modules are
# added by electron-builder in any case. Everything else in the checkout
# (design material, docs, notes, local tool folders) stays out without having
# to be excluded one by one. scripts/check-package-contents.mjs checks the
# result after every build.
files:
  - out/**
  - resources/**
  - package.json
  - LICENSE
asarUnpack:
  - resources/**
  - '**/*.node'
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]

win:
  executableName: TimeTrack
  target:
    - nsis
nsis:
  # #198 — cooperative release of the app binary held by bundled MCP servers,
  # ahead of the built-in app-running check. See build/installer.nsh.
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
# Electron fuses hardening — currently NOT configured (no `electronFuses:`
# block, no @electron/fuses afterPack hook). If you ever add one to harden the
# packaged binary, the RunAsNode fuse MUST stay enabled: since v1.14.2 the
# bundled MCP server runs the app binary in Node mode (ELECTRON_RUN_AS_NODE=1,
# see src/main/mcpLaunch.ts). Disabling RunAsNode silently breaks the MCP
# integration — the server would refuse to launch with no visible error.
npmRebuild: false
publish:
  provider: github
  owner: wald-it
  repo: time-tracking
