name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true
      ref:
        description: 'Optional. Leave empty to build the ref selected under "Use workflow from". If set, it must resolve to that same commit (the provenance attestation names it).'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Every job declares its own permissions; nothing is granted by default.
permissions: {}

jobs:
  # #138: Validate and (for workflow_dispatch) materialize the release tag
  # before anything is built. On a tag push this job is a cheap guard; on
  # workflow_dispatch it lets us release a ref whose tag does not exist yet.
  #
  # It also binds the release to one commit: `sha` is resolved once here and
  # every later job checks out exactly that commit, so all installers, the
  # plugin and the release notes come from the commit the tag points to — not
  # from whatever a branch name resolves to minutes later in another job.
  #
  # The tag and the ref reach shell scripts only through `env:` and are used
  # as quoted variables; no `${{ }}` expression is expanded inside a `run:`
  # script (src/test/releaseWorkflow.test.ts checks this).
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      # First step, before checkout and before the write permission is used:
      # the tag must be a plain release version, and the ref a plain git ref.
      - name: Validate tag and ref
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not of the form vMAJOR.MINOR.PATCH (e.g. v1.22.0)."
            exit 1
          fi
          if [ -n "$REF" ] && { ! [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$REF" == -* ]]; }; then
            echo "::error::Ref '$REF' is not a branch name, tag or commit SHA."
            exit 1
          fi
          echo "Tag $TAG is valid."

      # A tag push builds the pushed tag; a dispatch builds the commit it was
      # started from (or inputs.ref, which must resolve to it). The
      # commit this resolves to is fixed in the next step; no later job
      # resolves a name again.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve tag and commit
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          # The provenance attestation names the commit the run was started
          # from (GITHUB_SHA, from the OIDC token), not what a job checked
          # out. Building anything else would publish an attestation for the
          # wrong source, so the two must be the same: a dispatch is started
          # from the ref to build ("Use workflow from"), and inputs.ref, if
          # given, must resolve to that commit.
          if [ "$SHA" != "$GITHUB_SHA" ]; then
            echo "::error::The commit to build ($SHA) is not the commit this run was started from ($GITHUB_SHA). Start the workflow from the ref you want to release (Run workflow → Use workflow from), so the provenance attestation names the commit that is built."
            exit 1
          fi
          # If the tag already exists on origin it must point at this commit.
          # For an annotated tag, the `^{}` line carries the commit it peels
          # to; a lightweight tag has only the plain line.
          REMOTE="$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")"
          if [ -n "$REMOTE" ]; then
            PEELED="$(awk -v ref="refs/tags/$TAG^{}" '$2 == ref { print $1 }' <<< "$REMOTE")"
            DIRECT="$(awk -v ref="refs/tags/$TAG" '$2 == ref { print $1 }' <<< "$REMOTE")"
            TAG_SHA="${PEELED:-$DIRECT}"
            if [ "$TAG_SHA" != "$SHA" ]; then
              echo "::error::Tag $TAG already exists and points at $TAG_SHA, not at the commit to build ($SHA). Dispatch with ref=$TAG to release the tagged commit, or use a new tag."
              exit 1
            fi
          fi
          echo "Releasing $TAG from commit $SHA."
          {
            echo "tag=$TAG"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' (version '$TAG_VERSION') does not match package.json version '$PKG_VERSION' at $(git rev-parse --short HEAD). Bump package.json or fix the tag before releasing — electron-updater compares the tag against latest.yml."
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG_VERSION at $(git rev-parse --short HEAD)."

      - name: Create tag on this commit if it does not exist
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Idempotent: on a tag push (or a dispatch with an existing tag) this
          # is a no-op — the previous step has already checked that the tag
          # points at $SHA. A tag pushed with GITHUB_TOKEN does NOT re-trigger
          # the `on: push: tags` workflow, so this cannot cause a release loop.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — leaving it untouched."
          else
            echo "Creating tag $TAG on $SHA and pushing it."
            git tag "$TAG" "$SHA"
            git push origin "refs/tags/$TAG"
          fi

  # #192: The Stream Deck plugin is packed into an installable
  # `.streamDeckPlugin` and shipped as a release asset. Until v1.17 it existed
  # only as source in the repo, so "hardware keys" reached exactly the people
  # willing to build and link a plugin themselves — the feature shipped, the
  # function did not.
  #
  # Its own job, because the package is platform-neutral (JS + manifest + PNGs)
  # and has nothing to do with the Electron build — it neither slows the two
  # installer jobs down nor fails with them.
  #
  # windows-latest, not ubuntu, although the work is OS-agnostic: `test.yml`
  # packs on Windows for every PR, so that is the environment with evidence
  # behind it. Shipping from an environment no gate exercises would be a claim
  # rather than a verification. (The archive itself is portable either way — a
  # plain ZIP with POSIX separators, checked on a Windows-packed file.)
  pack-streamdeck:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install plugin dependencies
        working-directory: streamdeck-plugin
        run: pnpm install --frozen-lockfile --ignore-workspace

      # No typecheck here, on purpose (#196). The plugin's tsconfig also covers
      # its test files, which import `vitest` — and vitest is a dependency of
      # the ROOT package, not of the plugin. `test.yml` installs the root first
      # and typechecks there on every pull request, which is the environment
      # where the check means something. This job has no root install, so
      # running it here fails on module resolution, not on a type error: that
      # is what broke the v1.18.0 release run.
      #
      # This job's purpose is to produce the artifact. Verification belongs to
      # the gate that every commit passes before it reaches main — and `pack`
      # still validates the manifest below, which is the part that can only
      # fail here.
      - name: Build bundle
        working-directory: streamdeck-plugin
        run: pnpm build

      # `pack` refuses to package a manifest that would not install (icons must
      # be PNG, layouts must resolve). Running validate first makes that failure
      # say what is wrong instead of just aborting the pack.
      #
      # Both steps run with pinned validation rules (--no-update-check, see
      # package.json). A release must not fail because Elgato published a rule
      # change while the job was running; the same commands ran green on the PR
      # that produced this commit. `pnpm run validate:rules` is where new rules
      # are picked up, deliberately.
      - name: Validate manifest
        working-directory: streamdeck-plugin
        run: pnpm run validate

      - name: Pack .streamDeckPlugin
        working-directory: streamdeck-plugin
        run: pnpm run pack

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-streamdeck-plugin
          path: streamdeck-plugin/dist/*.streamDeckPlugin
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      APP_EXE: dist/win-unpacked/TimeTrack.exe
      APP_RESOURCES: dist/win-unpacked/resources
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      # #269: no native rebuild step — better-sqlite3 is N-API and ships its
      # prebuilt binaries (see test.yml).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # #151/#269: `pnpm test` runs Vitest on the Electron binary in Node mode,
      # the runtime the installer ships.
      - name: Test
        run: pnpm test

      - name: Build installer (NSIS)
        run: |
          pnpm run build
          pnpm exec electron-builder --win --publish never

      - name: Check package contents (only runtime files in app.asar)
        run: node scripts/check-package-contents.mjs dist/win-unpacked/resources/app.asar

      - name: Smoke test packaged app (DB + migrations + PDF)
        shell: bash
        run: node scripts/package-smoke.mjs smoke --exe "$APP_EXE"

      - name: MCP server from the package (initialize, tools/list, tools/call)
        shell: bash
        run: |
          node scripts/package-smoke.mjs mcp \
            --exe "$APP_EXE" \
            --entry "$APP_RESOURCES/app.asar/out/mcp/mcp/server.js" \
            --server-source src/mcp/server.ts

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      APP_EXE: dist/mac-arm64/TimeTrack.app/Contents/MacOS/TimeTrack
      APP_RESOURCES: dist/mac-arm64/TimeTrack.app/Contents/Resources
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      # #269: no native rebuild step (see the Windows job).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build app (DMG + ZIP, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm run build
          pnpm exec electron-builder --mac --publish never

      - name: Check package contents (only runtime files in app.asar)
        run: node scripts/check-package-contents.mjs dist/mac-arm64/TimeTrack.app/Contents/Resources/app.asar

      - name: Smoke test packaged app (DB + migrations + PDF)
        shell: bash
        run: node scripts/package-smoke.mjs smoke --exe "$APP_EXE"

      - name: MCP server from the package (initialize, tools/list, tools/call)
        shell: bash
        run: |
          node scripts/package-smoke.mjs mcp \
            --exe "$APP_EXE" \
            --entry "$APP_RESOURCES/app.asar/out/mcp/mcp/server.js" \
            --server-source src/mcp/server.ts

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

  # #221: one failed build job no longer discards what the others built. Until
  # v1.19.0 this job needed all three to succeed, so a green, smoke-tested
  # installer went down with an unrelated platform (v1.18.0: the plugin job;
  # v1.19.0: the macOS job) and had to be rebuilt on a new tag.
  #
  # It now runs once the tag is valid and at least one installer exists; a
  # release with nothing to install is not published. How a partial release is
  # marked is decided in scripts/release-plan.mjs: a missing installer makes it
  # a prerelease (electron-updater ignores those, so no client is offered a
  # version whose update feed is missing), a missing plugin alone does not.
  #
  # `!cancelled()` rather than `always()`: a run the owner cancels still
  # publishes nothing. Without any status function GitHub adds an implicit
  # `success()`, which is the old all-or-nothing behaviour.
  publish-release:
    needs: [prepare, build-windows, build-macos, pack-streamdeck]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    # contents: write to create the release; id-token and attestations only
    # for the build provenance step below.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      # #221: each download only runs for a job that succeeded — a failed job
      # uploaded nothing, and a missing artifact would fail this job too.
      - name: Download installer artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timetrack-windows-installer
          path: dist

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timetrack-macos
          path: dist

      # #192: lands in dist/ like the installers and is uploaded by the same
      # `dist/*` glob below — double-click installs it into the Stream Deck app.
      - name: Download Stream Deck plugin artifact
        if: needs.pack-streamdeck.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timetrack-streamdeck-plugin
          path: dist

      # A signed build provenance attestation for every file this run
      # attaches to the release: it records that the file was built by this
      # workflow, in this repository, from the commit `prepare` bound the
      # release to. Users check it with `gh attestation verify` (the release
      # notes say how).
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Plan release (complete or partial)
        id: plan
        env:
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          STREAMDECK_RESULT: ${{ needs.pack-streamdeck.result }}
          NOTICE_FILE: ${{ runner.temp }}/release-notice.md
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        # #234: on a re-run this plan is provisional (no ::warning:: yet) —
        # the update path re-plans from the attached assets.
        run: |
          RELEASE_EXISTS=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then RELEASE_EXISTS=true; fi
          RELEASE_EXISTS="$RELEASE_EXISTS" node scripts/release-plan.mjs

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
          # #234: the re-run path plans again, from the attached assets.
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          STREAMDECK_RESULT: ${{ needs.pack-streamdeck.result }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          NOTICE_FILE="$RUNNER_TEMP/release-notice.md"

          # #137: Build the release body from the matching CHANGELOG.md section
          # — everything between the "## [VERSION]" heading and the next "## ["
          # heading, with the heading line and surrounding blank lines trimmed.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { buf[++n] = $0 }
            END {
              first = 0; last = 0
              for (i = 1; i <= n; i++)
                if (buf[i] ~ /[^[:space:]]/) { if (!first) first = i; last = i }
              for (i = first; i <= last && first > 0; i++) print buf[i]
            }
          ' CHANGELOG.md > "$NOTES_FILE"

          # The body must never be empty: if there is no matching CHANGELOG
          # section, fall back to GitHub's auto-generated notes. We use the REST
          # endpoint (not the `--generate-notes` flag) so the update path below
          # — `gh release edit`, which has no `--generate-notes` — can reuse the
          # exact same notes file.
          if [ -s "$NOTES_FILE" ]; then
            echo "Release notes: CHANGELOG.md section [$VERSION] ($(wc -l < "$NOTES_FILE") lines)."
          else
            echo "Release notes: no CHANGELOG.md section for [$VERSION] — using GitHub auto-generated notes."
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body' > "$NOTES_FILE"
          fi

          # #221: a partial release opens with a notice naming what is missing
          # (empty for a complete release). Composed per path below: the
          # re-run path rewrites the notice after it has re-planned.
          CHANGELOG_NOTES="$RUNNER_TEMP/release-notes-changelog.md"
          mv "$NOTES_FILE" "$CHANGELOG_NOTES"

          # The notes close with the SHA-256 checksum of every attached file
          # and how a user verifies a download. $1 is a directory holding
          # exactly the files attached to the release.
          VERIFY_FILE="$RUNNER_TEMP/release-verify.md"
          # The backticks in single quotes are Markdown, not command substitution.
          # shellcheck disable=SC2016
          write_verify_section() {
            {
              echo
              echo '## Verify your download'
              echo
              echo "These files were built by the release workflow of this repository from commit \`$SHA\`. SHA-256 checksums:"
              echo
              echo '```text'
              (cd "$1" && sha256sum -- *)
              echo '```'
              echo
              echo 'To check a downloaded file:'
              echo
              echo '- Checksum on Windows (PowerShell): `Get-FileHash <file> -Algorithm SHA256`. PowerShell prints the hash in upper case; compare it with the line above ignoring case.'
              echo '- Checksum on macOS: `shasum -a 256 <file>`'
              echo "- Build provenance (GitHub CLI): \`gh attestation verify <file> -R $GITHUB_REPOSITORY\`. It confirms the file was built by GitHub Actions in this repository and names the workflow and commit it was built from."
            } > "$VERIFY_FILE"
          }
          compose_notes() {
            cat "$NOTICE_FILE" "$CHANGELOG_NOTES" "$VERIFY_FILE" > "$NOTES_FILE"
          }

          # The flag is set on both paths: a re-run that completes a partial
          # release also lifts its prerelease mark.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — re-uploading assets, then updating body and flags."
            WAS_PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
            # Upload first: lifting the prerelease mark before the missing
            # installers and latest*.yml are attached would show stable
            # clients a release without an update feed — and leave it so if
            # the upload fails or the run is cancelled in between.
            gh release upload "$TAG" dist/* --clobber
            # #234: this run's job results describe the re-run, not the
            # release. --clobber removes nothing, so a job that fails now
            # leaves the first run's installers and latest*.yml attached;
            # planning from the job results alone would demote a complete
            # release to a prerelease and withdraw it from stable updates.
            # Plan again from what is attached after the upload. A failed
            # lookup aborts the step (set -e) before the release is edited.
            RELEASE_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            PLAN_OUTPUT="$RUNNER_TEMP/release-plan-rerun.txt"
            : > "$PLAN_OUTPUT"
            RELEASE_ASSETS="$RELEASE_ASSETS" GITHUB_OUTPUT="$PLAN_OUTPUT" NOTICE_FILE="$NOTICE_FILE" node scripts/release-plan.mjs
            PRERELEASE="$(sed -n 's/^prerelease=//p' "$PLAN_OUTPUT")"
            if [ "$PRERELEASE" != "true" ] && [ "$PRERELEASE" != "false" ]; then
              echo "::error::Re-plan from the attached assets gave prerelease='$PRERELEASE'."
              exit 1
            fi
            # Files a failed job did not rebuild in this run are still attached
            # from the earlier run, so the checksums are taken from what the
            # release carries now, not from this run's dist/.
            ATTACHED_DIR="$RUNNER_TEMP/release-assets"
            rm -rf "$ATTACHED_DIR"
            gh release download "$TAG" --dir "$ATTACHED_DIR"
            write_verify_section "$ATTACHED_DIR"
            compose_notes
            # electron-updater reads /releases/latest, and GitHub does not
            # reliably move that marker when a prerelease becomes a normal
            # release. scripts/release-latest.mjs decides whether --latest is
            # safe: only for a former prerelease that is now complete, and only
            # if its tag is newer than the current latest release — completing
            # v1.20.0 after v1.21.0 shipped must not move the marker back. A
            # failed lookup leaves CURRENT_LATEST empty, which fails closed.
            CURRENT_LATEST="$(gh release view --json tagName --jq '.tagName' 2>/dev/null || true)"
            MARK_LATEST="$(TAG="$TAG" CURRENT_LATEST="$CURRENT_LATEST" WAS_PRERELEASE="$WAS_PRERELEASE" PRERELEASE="$PRERELEASE" node scripts/release-latest.mjs)"
            LATEST_FLAG=()
            if [ "$MARK_LATEST" = "true" ]; then
              LATEST_FLAG=(--latest)
            fi
            gh release edit "$TAG" --notes-file "$NOTES_FILE" --prerelease="$PRERELEASE" "${LATEST_FLAG[@]}"
          else
            write_verify_section dist
            compose_notes
            # --verify-tag: never let gh create the tag itself (it would put
            # it on the default branch); `prepare` has created it on $SHA.
            gh release create "$TAG" \
              --verify-tag \
              --title "TimeTrack $TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease="$PRERELEASE" \
              dist/*
          fi
