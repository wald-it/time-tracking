name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.1.0)'
        required: true
      ref:
        description: 'Git ref to build and tag (branch, SHA or existing tag)'
        required: false
        default: main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # #138: Validate and (for workflow_dispatch) materialize the release tag
  # before anything is built. On a tag push this job is a cheap no-op guard;
  # on workflow_dispatch it lets us release a ref whose tag does not exist yet.
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve tag
        id: resolve
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' (version '$TAG_VERSION') does not match package.json version '$PKG_VERSION'. Bump package.json or fix the tag before releasing — electron-updater compares the tag against latest.yml."
            exit 1
          fi
          echo "Tag $TAG matches package.json version $PKG_VERSION."

      - name: Create tag on this commit if it does not exist
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve.outputs.tag }}"
          # Idempotent: on a tag push (or a dispatch with an existing tag) this
          # is a no-op. A tag pushed with GITHUB_TOKEN does NOT re-trigger the
          # `on: push: tags` workflow, so this cannot cause a release loop.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin — leaving it untouched."
          else
            echo "Creating tag $TAG on $(git rev-parse --short HEAD) and pushing it."
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
          fi

  # #192: The Stream Deck plugin is packed into an installable
  # `.streamDeckPlugin` and shipped as a release asset. Until v1.17 it existed
  # only as source in the repo, so "hardware keys" reached exactly the people
  # willing to build and link a plugin themselves — the feature shipped, the
  # function did not.
  #
  # Its own job, because the package is platform-neutral (JS + manifest + PNGs)
  # and has nothing to do with the Electron build — it neither slows the two
  # installer jobs down nor fails with them.
  #
  # windows-latest, not ubuntu, although the work is OS-agnostic: `test.yml`
  # packs on Windows for every PR, so that is the environment with evidence
  # behind it. Shipping from an environment no gate exercises would be a claim
  # rather than a verification. (The archive itself is portable either way — a
  # plain ZIP with POSIX separators, checked on a Windows-packed file.)
  pack-streamdeck:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Install plugin dependencies
        working-directory: streamdeck-plugin
        run: pnpm install --frozen-lockfile --ignore-workspace

      # No typecheck here, on purpose (#196). The plugin's tsconfig also covers
      # its test files, which import `vitest` — and vitest is a dependency of
      # the ROOT package, not of the plugin. `test.yml` installs the root first
      # and typechecks there on every pull request, which is the environment
      # where the check means something. This job has no root install, so
      # running it here fails on module resolution, not on a type error: that
      # is what broke the v1.18.0 release run.
      #
      # This job's purpose is to produce the artifact. Verification belongs to
      # the gate that every commit passes before it reaches main — and `pack`
      # still validates the manifest below, which is the part that can only
      # fail here.
      - name: Build bundle
        working-directory: streamdeck-plugin
        run: pnpm build

      # `pack` refuses to package a manifest that would not install (icons must
      # be PNG, layouts must resolve). Running validate first makes that failure
      # say what is wrong instead of just aborting the pack.
      #
      # Both steps run with pinned validation rules (--no-update-check, see
      # package.json). A release must not fail because Elgato published a rule
      # change while the job was running; the same commands ran green on the PR
      # that produced this commit. `pnpm run validate:rules` is where new rules
      # are picked up, deliberately.
      - name: Validate manifest
        working-directory: streamdeck-plugin
        run: pnpm run validate

      - name: Pack .streamDeckPlugin
        working-directory: streamdeck-plugin
        run: pnpm run pack

      - name: Upload plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-streamdeck-plugin
          path: streamdeck-plugin/dist/*.streamDeckPlugin
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #151: install-app-deps decides via the .forge-meta marker, which can
      # disagree with the binary beside it (pnpm caches native build side effects
      # across runs). Force the rebuild so both the tests and the packaged app get
      # the real Electron ABI — a stale marker here would ship a broken binary.
      - name: Ensure better-sqlite3 matches the Electron ABI (forced)
        run: pnpm exec electron-rebuild -f -w better-sqlite3

      - name: Typecheck
        run: pnpm typecheck

      # #151: `pnpm test` runs Vitest on the Electron binary in Node mode, so it
      # uses the same binary the installer will ship. The rebuild-for-Node /
      # rebuild-back-for-Electron round-trip that used to bracket this step is
      # gone; the single forced rebuild after install replaces it. That also
      # removes the old failure mode where packaging inherited a Node-ABI binary
      # because the second rebuild silently no-oped.
      - name: Test
        run: pnpm test

      - name: Build installer (NSIS)
        run: |
          pnpm run build
          pnpm exec electron-builder --win --publish never

      - name: Smoke test packaged binary (DB + migrations against Electron ABI)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist/win-unpacked" -Filter "*.exe" |
                 Where-Object { $_.Name -notmatch '(uninstall|crashpad|elevate)' } |
                 Select-Object -First 1
          if (-not $exe) {
            Write-Error "No packaged exe found in dist/win-unpacked"
            exit 1
          }
          $out = Join-Path $env:RUNNER_TEMP "smoke.json"
          if (Test-Path $out) { Remove-Item $out -Force }
          Write-Host "Running smoke test: $($exe.FullName) --smoke-test=$out"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test=$out" -PassThru -NoNewWindow
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force
            Write-Error "Smoke test timed out after 60s"
            exit 1
          }
          if ($proc.ExitCode -ne 0) {
            Write-Error "Smoke test exited with code $($proc.ExitCode)"
            if (Test-Path $out) { Get-Content $out }
            exit 1
          }
          if (-not (Test-Path $out)) {
            Write-Error "Smoke test did not produce $out"
            exit 1
          }
          $payload = Get-Content $out -Raw | ConvertFrom-Json
          Write-Host "Smoke result: $($payload | ConvertTo-Json -Compress)"
          if (-not $payload.ok) {
            Write-Error "Smoke test reported ok=false: $($payload.error)"
            exit 1
          }
          if ($payload.schemaVersion -lt 3) {
            Write-Error "Expected schemaVersion >= 3 (v1.2 migrations), got $($payload.schemaVersion)"
            exit 1
          }
          if (-not $payload.pdfBytes -or $payload.pdfBytes -lt 1000) {
            Write-Error "Expected pdfBytes >= 1000 (v1.3 PDF pipeline), got $($payload.pdfBytes)"
            exit 1
          }
          Write-Host "Smoke test passed (schema v$($payload.schemaVersion), Electron $($payload.electronVersion), PDF $($payload.pdfBytes) bytes)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-windows-installer
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error

  build-macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #151: install-app-deps decides via the .forge-meta marker, which can
      # disagree with the binary beside it (pnpm caches native build side effects
      # across runs). Force the rebuild so both the tests and the packaged app get
      # the real Electron ABI — a stale marker here would ship a broken binary.
      - name: Ensure better-sqlite3 matches the Electron ABI (forced)
        run: pnpm exec electron-rebuild -f -w better-sqlite3

      - name: Typecheck
        run: pnpm typecheck

      # #151: see the note in the Windows job — Vitest runs on Electron now, so
      # the ABI round-trip around this step is replaced by the single forced
      # rebuild after install.
      - name: Test
        run: pnpm test

      - name: Build app (DMG + ZIP, arm64)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          pnpm run build
          pnpm exec electron-builder --mac --publish never

      - name: Smoke test packaged binary (DB + migrations against Electron ABI)
        run: |
          APP_BINARY="dist/mac-arm64/TimeTrack.app/Contents/MacOS/TimeTrack"
          if [ ! -f "$APP_BINARY" ]; then
            echo "ERROR: Binary not found at $APP_BINARY"
            ls -la dist/ || true
            exit 1
          fi
          OUT="$RUNNER_TEMP/smoke.json"
          echo "Running smoke test: $APP_BINARY --smoke-test=$OUT"
          "$APP_BINARY" "--smoke-test=$OUT" &
          SMOKE_PID=$!
          WAITED=0
          while kill -0 $SMOKE_PID 2>/dev/null && [ $WAITED -lt 60 ]; do
            sleep 1
            WAITED=$((WAITED + 1))
          done
          if kill -0 $SMOKE_PID 2>/dev/null; then
            kill -9 $SMOKE_PID 2>/dev/null
            echo "ERROR: Smoke test timed out after 60s"
            exit 1
          fi
          wait $SMOKE_PID
          SMOKE_EXIT=$?
          if [ $SMOKE_EXIT -ne 0 ]; then
            echo "ERROR: Smoke test exited with code $SMOKE_EXIT"
            cat "$OUT" 2>/dev/null || true
            exit 1
          fi
          if [ ! -f "$OUT" ]; then
            echo "ERROR: Smoke test did not produce $OUT"
            exit 1
          fi
          python3 -c "
          import json, sys
          d = json.load(open('$OUT'))
          print('Smoke result:', json.dumps(d))
          if not d.get('ok'):
              print('ERROR: ok=false:', d.get('error'))
              sys.exit(1)
          if d.get('schemaVersion', 0) < 3:
              print('ERROR: schemaVersion', d.get('schemaVersion'))
              sys.exit(1)
          if d.get('pdfBytes', 0) < 1000:
              print('ERROR: pdfBytes', d.get('pdfBytes'))
              sys.exit(1)
          print('Smoke test passed (schema v{}, Electron {}, PDF {} bytes)'.format(
              d['schemaVersion'], d.get('electronVersion', '?'), d['pdfBytes']))
          "

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-macos
          path: |
            dist/*.dmg
            dist/*.dmg.blockmap
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

  # #221: one failed build job no longer discards what the others built. Until
  # v1.19.0 this job needed all three to succeed, so a green, smoke-tested
  # installer went down with an unrelated platform (v1.18.0: the plugin job;
  # v1.19.0: the macOS job) and had to be rebuilt on a new tag.
  #
  # It now runs once the tag is valid and at least one installer exists; a
  # release with nothing to install is not published. How a partial release is
  # marked is decided in scripts/release-plan.mjs: a missing installer makes it
  # a prerelease (electron-updater ignores those, so no client is offered a
  # version whose update feed is missing), a missing plugin alone does not.
  #
  # `!cancelled()` rather than `always()`: a run the owner cancels still
  # publishes nothing. Without any status function GitHub adds an implicit
  # `success()`, which is the old all-or-nothing behaviour.
  publish-release:
    needs: [prepare, build-windows, build-macos, pack-streamdeck]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      # #221: each download only runs for a job that succeeded — a failed job
      # uploaded nothing, and a missing artifact would fail this job too.
      - name: Download installer artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timetrack-windows-installer
          path: dist

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timetrack-macos
          path: dist

      # #192: lands in dist/ like the installers and is uploaded by the same
      # `dist/*` glob below — double-click installs it into the Stream Deck app.
      - name: Download Stream Deck plugin artifact
        if: needs.pack-streamdeck.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: timetrack-streamdeck-plugin
          path: dist

      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Plan release (complete or partial)
        id: plan
        env:
          WINDOWS_RESULT: ${{ needs.build-windows.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          STREAMDECK_RESULT: ${{ needs.pack-streamdeck.result }}
          NOTICE_FILE: ${{ runner.temp }}/release-notice.md
        run: node scripts/release-plan.mjs

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          NOTICE_FILE="$RUNNER_TEMP/release-notice.md"

          # #137: Build the release body from the matching CHANGELOG.md section
          # — everything between the "## [VERSION]" heading and the next "## ["
          # heading, with the heading line and surrounding blank lines trimmed.
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { buf[++n] = $0 }
            END {
              first = 0; last = 0
              for (i = 1; i <= n; i++)
                if (buf[i] ~ /[^[:space:]]/) { if (!first) first = i; last = i }
              for (i = first; i <= last && first > 0; i++) print buf[i]
            }
          ' CHANGELOG.md > "$NOTES_FILE"

          # The body must never be empty: if there is no matching CHANGELOG
          # section, fall back to GitHub's auto-generated notes. We use the REST
          # endpoint (not the `--generate-notes` flag) so the update path below
          # — `gh release edit`, which has no `--generate-notes` — can reuse the
          # exact same notes file.
          if [ -s "$NOTES_FILE" ]; then
            echo "Release notes: CHANGELOG.md section [$VERSION] ($(wc -l < "$NOTES_FILE") lines)."
          else
            echo "Release notes: no CHANGELOG.md section for [$VERSION] — using GitHub auto-generated notes."
            gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="$TAG" --jq '.body' > "$NOTES_FILE"
          fi

          # #221: a partial release opens with a notice naming what is missing
          # (empty for a complete release).
          cat "$NOTICE_FILE" "$NOTES_FILE" > "$NOTES_FILE.tmp"
          mv "$NOTES_FILE.tmp" "$NOTES_FILE"

          # The flag is set on both paths: a re-run that completes a partial
          # release also lifts its prerelease mark.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — re-uploading assets, then updating body and flags."
            WAS_PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')"
            # Upload first: lifting the prerelease mark before the missing
            # installers and latest*.yml are attached would show stable
            # clients a release without an update feed — and leave it so if
            # the upload fails or the run is cancelled in between.
            gh release upload "$TAG" dist/* --clobber
            # electron-updater reads /releases/latest, and GitHub does not
            # reliably move that marker when a prerelease becomes a normal
            # release. Only a release that was a prerelease gets --latest: a
            # plain re-run of an older, complete release must not take the
            # marker from a newer one.
            LATEST_FLAG=()
            if [ "$WAS_PRERELEASE" = "true" ] && [ "$PRERELEASE" = "false" ]; then
              LATEST_FLAG=(--latest)
            fi
            gh release edit "$TAG" --notes-file "$NOTES_FILE" --prerelease="$PRERELEASE" "${LATEST_FLAG[@]}"
          else
            gh release create "$TAG" \
              --title "TimeTrack $TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease="$PRERELEASE" \
              dist/*
          fi
