name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # #217 — the suite runs on both platforms the release builds for.
  #
  # Until v1.19.0 this gate was windows-latest only, while release.yml runs the
  # same `pnpm test` on windows AND macos. That made the release workflow the
  # first place a platform-dependent test could fail — and it fails there after
  # the tag is pushed, with publish-release needing every build job, so one unit
  # test discards a finished release. It happened twice: #196 (v1.18.0) and
  # again cutting v1.19.0, where a test read `process.env.ProgramFiles` and
  # inverted on macOS because that variable does not exist there.
  #
  # fail-fast is off on purpose: when a change breaks one platform, the useful
  # information is whether the other one survived it.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # A rebase once left conflict markers in CHANGELOG.md and they were
      # pushed (release 1.22). Fail before anything else runs.
      - name: No merge conflict markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- . ':!node_modules'; then
            echo "::error::Merge conflict markers found (lines above)."
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # #151: `install-app-deps` (via postinstall) decides whether to rebuild by
      # reading node_modules/better-sqlite3/build/Release/.forge-meta — and that
      # marker can disagree with the binary next to it. pnpm's store cache keeps
      # native build side effects across runs, so a Node-ABI binary carrying a
      # stale "Electron" marker survives into later jobs and postinstall no-ops
      # on it in ~1ms. Force the rebuild instead of trusting the marker; this is
      # the ABI both the tests and the packaged app need.
      - name: Ensure better-sqlite3 matches the Electron ABI (forced)
        run: pnpm exec electron-rebuild -f -w better-sqlite3

      # #144: The bundled attribution file is committed (generated by the
      # prebuild hook) and drifts silently when dependencies change. Regenerate
      # it and fail if the result differs from what is checked in. The script
      # walks only the production dependency graph and writes deterministic
      # output (no timestamps, no absolute paths, locale-stable sort), so this
      # gate is reproducible on the windows-latest runner it authors on.
      #
      # Windows only, and not merely by tradition (#217): the script walks the
      # production dependency graph, which contains platform-specific optional
      # packages (@esbuild/win32-x64 against @esbuild/darwin-arm64). On macOS
      # the regenerated file would legitimately differ from the committed one
      # and this gate would fail on every PR for no defect at all.
      - name: Verify bundled licenses.json is in sync
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-licenses.mjs
          if ! git diff --exit-code resources/licenses.json; then
            echo "::error::resources/licenses.json is out of date. Run 'node scripts/generate-licenses.mjs' (or 'pnpm build') and commit the result."
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      # #143: ESLint als CI-Gate. --max-warnings bewusst offen gelassen, solange
      # die verbleibenden Warnungen react-hooks-Hinweise sind; Fehler lassen den
      # Job ohnehin scheitern.
      #
      # Windows only (#217): ESLint reads the same sources on either platform,
      # so a second run buys nothing but runner minutes. Typecheck and test
      # above DO run on both — those are the ones that can disagree.
      - name: Lint
        if: runner.os == 'Windows'
        run: pnpm lint

      # #151: `pnpm test` runs Vitest on the Electron binary in Node mode, so it
      # loads the very binary the app ships with — no rebuild-to-Node and back.
      # The old `pnpm rebuild better-sqlite3` step here was actively harmful: it
      # swapped in a Node-ABI binary and left the .forge-meta marker claiming
      # Electron, which is how the cached poison above came to exist.
      - name: Test
        run: pnpm test

      # #190: The Stream Deck plugin is its own package (own lockfile, own
      # toolchain) and is NOT part of the app build. Its pure modules already
      # run inside `pnpm test` as the `streamdeck` Vitest project — but nothing
      # checked that the plugin still compiles or bundles. That gap matters
      # more than usual here: a plugin crash leaves no trace (Elgato logs only
      # "Plugin connected"; stdout goes nowhere), so a broken build would first
      # show up as a key that silently does nothing.
      #
      # Order matters: the plugin's tsconfig also typechecks its test files,
      # which import `vitest` — that resolves upwards into the root
      # node_modules installed above. Do not move these steps before the root
      # install.
      #
      # All five plugin steps are Windows only (#217). release.yml packs the
      # plugin on windows-latest deliberately — "that is the environment with
      # evidence behind it" — so gating it on the same platform keeps the gate
      # and the release in step. Running them on macOS too would prove a path
      # no release ever takes.
      - name: Stream Deck plugin — install
        if: runner.os == 'Windows'
        working-directory: streamdeck-plugin
        run: pnpm install --frozen-lockfile --ignore-workspace

      - name: Stream Deck plugin — typecheck
        if: runner.os == 'Windows'
        working-directory: streamdeck-plugin
        run: pnpm typecheck

      - name: Stream Deck plugin — build
        if: runner.os == 'Windows'
        working-directory: streamdeck-plugin
        run: pnpm build

      # #192 follow-up: the release job packs the plugin, but release.yml only
      # triggers on tags — so until now the artifact path was first exercised
      # while cutting a release, which is the worst moment to discover that the
      # manifest does not validate. Producing the package here proves it on
      # every PR instead.
      #
      # Both commands carry --no-update-check (see package.json): the CLI
      # otherwise fetches its validation rules at run time, which would let a
      # server-side rule change turn an unrelated PR red. The pinned CLI plus
      # pinned rules make this reproducible; `pnpm run validate:rules` is the
      # deliberate check for whether Elgato changed anything.
      - name: Stream Deck plugin — validate manifest
        if: runner.os == 'Windows'
        working-directory: streamdeck-plugin
        run: pnpm run validate

      - name: Stream Deck plugin — pack
        if: runner.os == 'Windows'
        working-directory: streamdeck-plugin
        run: pnpm run pack

      # Side benefit worth the five lines: the packed plugin of any PR can be
      # downloaded from the run and installed on real hardware before merging.
      - name: Upload packed plugin
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timetrack-streamdeck-plugin-${{ github.sha }}
          path: streamdeck-plugin/dist/*.streamDeckPlugin
          if-no-files-found: error

  # #263: the Heute totals and the weekday average cut days with SQLite's
  # 'localtime', which reads the zone the process starts in and ignores a
  # process.env.TZ set later (on Windows it does not take an IANA zone from TZ
  # the way JS does). They can only be tested in Europe/Berlin when the whole
  # job runs there: Linux, with TZ on the job. vitest.config.ts registers the
  # `berlin` project only in that zone, which is why the UTC jobs above never
  # see it. The rest of the suite runs here too, so every test also runs once
  # with JS and SQLite in Berlin.
  #
  # No licences, lint or Stream Deck steps: those are platform-independent or
  # Windows-only by design (see the test job above), and Linux is not a release
  # platform. The forced rebuild is not optional here either (#151).
  berlin-zone:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure better-sqlite3 matches the Electron ABI (forced)
        run: pnpm exec electron-rebuild -f -w better-sqlite3

      # Its own step, named: if the zone did not reach the config and the
      # project is not registered, Vitest fails here ("no projects matched")
      # instead of the job passing with the Berlin tests silently left out.
      - name: Test the berlin project (Europe/Berlin)
        id: berlin
        run: pnpm test --project berlin

      # Also after a red berlin step, so one run reports both — but not after a
      # failed install or rebuild, where every test would fail for that reason.
      - name: Test everything else (Europe/Berlin)
        if: ${{ success() || steps.berlin.outcome == 'failure' }}
        run: pnpm test --project '!berlin'
